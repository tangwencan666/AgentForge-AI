[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-backend"
version = "0.1.0"
description = "AgentForge AI durable workflows with explicitly Mock models"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "uvicorn>=0.34,<1", "sqlalchemy>=2.0.38,<2.1", "alembic>=1.14,<2",
  "asyncpg>=0.30,<1", "redis>=5.2,<8",
  "langgraph>=1.2.12,<2", "langchain>=1.0,<2",
  "docker>=7.1,<8",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
markers = ["integration: requires real project PostgreSQL and Redis", "sandbox: requires approved project Docker Runner and real sandbox image"]
